<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBites - Restaurant Menu</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .restaurant-header {
      padding: 60px 0;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200&auto=format&fit=crop&q=60') center/cover;
      color: white;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      margin-bottom: 40px;
    }
    .restaurant-header h1 {
      color: white;
      font-size: 44px;
      margin-bottom: 8px;
    }
    .menu-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 32px;
    }
    .category-menu {
      position: sticky;
      top: 100px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      height: fit-content;
    }
    .category-link {
      display: block;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .category-link:hover, .category-link.active {
      background: #fff7ed;
      color: var(--primary);
      font-weight: 600;
    }
    .menu-item-card {
      background: white;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .menu-item-img {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    .menu-item-details {
      flex-grow: 1;
    }
    .menu-item-price {
      font-size: 18px;
      color: var(--primary);
      font-weight: 700;
      margin-top: 8px;
    }
    .rating-stars {
      display: flex;
      gap: 4px;
      color: #eab308;
      cursor: pointer;
    }
    .tab-section {
      display: none;
    }
    .tab-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container navbar-container" id="navbar-container-hook">
      <!-- Loaded dynamically via client/js/api.js -->
    </div>
  </nav>

  <!-- Restaurant Info Header -->
  <header class="restaurant-header">
    <div class="container">
      <span class="badge badge-info" id="rest-cuisine">Cuisine</span>
      <h1 id="rest-name">Restaurant Name</h1>
      <p id="rest-desc" style="opacity: 0.9; max-width: 600px; font-size: 15px; margin-bottom: 16px;">Description</p>
      
      <div style="display: flex; gap: 24px; font-size: 14px; opacity: 0.9;">
        <span style="display: flex; align-items: center; gap: 6px;">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
          <strong id="rest-rating">0.0</strong> (Reviews)
        </span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
          <span id="rest-address">Address</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Navigation tabs between Menu & Reviews -->
  <div class="container" style="margin-bottom: 24px; border-bottom: 1px solid var(--border); display: flex; gap: 24px;">
    <button id="tab-btn-menu" class="btn btn-secondary active" style="border-radius: 0; border: none; border-bottom: 3px solid var(--primary); background: transparent; padding: 12px 16px; font-size: 16px; font-weight: 700; color: var(--primary);" onclick="switchRestaurantTab('menu')">Menu</button>
    <button id="tab-btn-reviews" class="btn btn-secondary" style="border-radius: 0; border: none; background: transparent; padding: 12px 16px; font-size: 16px; font-weight: 700; color: var(--text-secondary);" onclick="switchRestaurantTab('reviews')">Reviews & Ratings</button>
  </div>

  <!-- Main Menu Area -->
  <main class="container" style="margin-bottom: 80px;">
    
    <!-- Menu Tab View -->
    <div id="section-menu" class="tab-section active">
      <div class="menu-layout">
        <!-- Categories Sidebar -->
        <aside class="category-menu" id="menu-categories-list">
          <h3 style="font-size: 16px; margin-bottom: 12px; color: var(--text-secondary); text-transform: uppercase;">Categories</h3>
          <!-- Loaded dynamically -->
        </aside>

        <!-- Menu items list -->
        <section id="menu-items-section">
          <!-- Loaded dynamically -->
        </section>
      </div>
    </div>

    <!-- Reviews Tab View -->
    <div id="section-reviews" class="tab-section">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;">
        
        <!-- Reviews List -->
        <div>
          <h2 style="font-size: 24px; margin-bottom: 20px;">Customer Reviews</h2>
          <div id="reviews-list-hook" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Post Review form -->
        <div class="card" style="padding: 32px;">
          <h3 style="font-size: 22px; margin-bottom: 16px;">Write a Review</h3>
          
          <div id="review-form-unauth" style="display: none; text-align: center; padding: 20px; color: var(--text-secondary);">
            Please <a href="auth.html" style="color: var(--primary); font-weight: 600;">Login</a> to post a review.
          </div>

          <form id="review-form-hook" onsubmit="submitReview(event)">
            <div class="form-group">
              <label class="form-label">Rating</label>
              <div class="rating-stars" id="star-selector-hook">
                <span class="star-rating" data-star="1" onclick="selectStar(1)" style="font-size: 28px;">★</span>
                <span class="star-rating" data-star="2" onclick="selectStar(2)" style="font-size: 28px;">★</span>
                <span class="star-rating" data-star="3" onclick="selectStar(3)" style="font-size: 28px;">★</span>
                <span class="star-rating" data-star="4" onclick="selectStar(4)" style="font-size: 28px;">★</span>
                <span class="star-rating" data-star="5" onclick="selectStar(5)" style="font-size: 28px;">★</span>
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
              <label class="form-label" for="review-comment">Comment</label>
              <textarea id="review-comment" class="form-input" rows="4" placeholder="Share your dining experience..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
          </form>
        </div>

      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/restaurant.js"></script>
</body>
</html>
